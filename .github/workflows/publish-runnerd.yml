# Build + publish the runnerd base image to GHCR whenever main changes it.
#
# The staging box deliberately runs NO self-hosted runner: GitHub-triggered code must never
# execute there. Deploys are pull-only instead — this cloud job publishes
# ghcr.io/secrouter/secchat-runnerd:base, secagent's deploy-staging workflow layers a chosen
# secagent build on top of it (ghcr.io/secrouter/secchat-runnerd-pool:pool), and the staging
# box's poller (a fixed, operator-owned systemd timer) pulls the result into k3s.
name: publish-runnerd

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runnerd
      - src/**
      - tsconfig.json
      - .github/workflows/publish-runnerd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runnerd
  cancel-in-progress: true   # only the newest base matters

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push the base image
        run: |
          docker build -f Dockerfile.runnerd \
            --label org.secchat.runnerd.sha="${{ github.sha }}" \
            -t ghcr.io/secrouter/secchat-runnerd:base .
          docker push ghcr.io/secrouter/secchat-runnerd:base
