# SecChat — auditable team + agentic chat backend, packaged for the SecRouter suite's Docker
# Compose deploy path (driven by bootstrap/secchat.sh, or SecDeploy calling the same verbs).
#
#   cp .env.example .env && edit    # set PG_PASSWORD + the SecSSO issuer/audience
#   ./bootstrap/secchat.sh up
name: secchat

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: secchat
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: secchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secchat"]
      interval: 5s
      retries: 10
    # Internal only — not published to the host; the secchat app is the only client.

  secchat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-topology values fixed here so they always point at the compose service names
      # regardless of what .env says (matches the sibling stacks' convention).
      DATABASE_URL: postgres://secchat:${PG_PASSWORD}@postgres:5432/secchat
      SECCHAT_HOST: 0.0.0.0
      SECCHAT_PORT: "47010"
      # OIDC discovery/token-exchange fetches SECCHAT_OIDC_ISSUER + SECROUTER_URL (sec.internal)
      # — that DNS only resolves via the HOST's resolver (macOS /etc/resolver, or SecDNS on
      # fedora-fips), invisible to a container's own DNS. host-gateway reaches secproxy, the only
      # thing that actually terminates TLS for these hostnames; the suite CA below lets Node
      # verify that cert instead of failing with UNABLE_TO_VERIFY_LEAF_SIGNATURE.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/suite-ca.pem}
      # Attachment BYTES (content-addressed blobs) — on the named volume below, NOT the
      # container's writable layer, so they survive rebuilds/`down` and ride the backup flow
      # (bootstrap/secchat.sh backup copies this dir alongside the pg_dump).
      SECCHAT_UPLOADS_DIR: /var/lib/secchat/uploads
    extra_hosts:
      - "secsso.sec.internal:host-gateway"
      - "secrouter.sec.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SECCHAT_HTTP_PORT:-47010}:47010"
    volumes:
      - ${SUITE_CA_PATH:-../../out/seccert-root.pem}:/etc/ssl/certs/suite-ca.pem:ro
      - uploads:/var/lib/secchat/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:47010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: {}
  # Attachment blobs (content-addressed by sha256). A separate volume from pgdata: rows/chains
  # live in Postgres, bytes live here — backup/restore handles BOTH (see bootstrap/secchat.sh).
  uploads: {}
